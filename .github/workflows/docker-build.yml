name: Build and Push Docker Images

on:
    push:
        branches:
            - main
            - develop
        tags:
            - "v*"
    pull_request:
        branches:
            - main
    workflow_dispatch:

env:
    REGISTRY: ghcr.io
    BACKEND_IMAGE_NAME: ${{ github.repository }}/backend
    FRONTEND_IMAGE_NAME: ${{ github.repository }}/frontend

jobs:
    build-backend:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            # QEMU lets the amd64 runner build the arm64 image as well.
            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata for Docker
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}
                  tags: |
                      type=ref,event=branch
                      type=ref,event=pr
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=sha
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: Build and push Backend Docker image
              uses: docker/build-push-action@v5
              with:
                  context: ./backend
                  file: ./docker/backend.Dockerfile
                  push: ${{ github.event_name != 'pull_request' }}
                  platforms: linux/amd64,linux/arm64
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=backend
                  cache-to: type=gha,mode=max,scope=backend
                  target: production

    build-frontend:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            # QEMU lets the amd64 runner build the arm64 image as well.
            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata for Docker
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}
                  tags: |
                      type=ref,event=branch
                      type=ref,event=pr
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=sha
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: Build and push Frontend Docker image
              uses: docker/build-push-action@v5
              with:
                  context: ./frontend
                  file: ./docker/frontend.Dockerfile
                  push: ${{ github.event_name != 'pull_request' }}
                  platforms: linux/amd64,linux/arm64
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  # Same values as the dev build. The API goes same-origin through Caddy, and the
                  # WebSocket URL is derived from the page origin, so one image serves any domain.
                  build-args: |
                      NEXT_PUBLIC_API_URL=/api/v1
                      NEXT_PUBLIC_WS_URL=
                  cache-from: type=gha,scope=frontend
                  cache-to: type=gha,mode=max,scope=frontend
                  target: production
