[project]
name = "kinora-backend"
version = "1.0.0"
description = "Kinora media automation backend"
requires-python = ">=3.14"
dependencies = [
    # Web Framework
    "fastapi>=0.143.0",
    "granian[reload]>=2.8.4",
    # Database
    "asyncpg>=0.32.0",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.1.4",
    "alembic>=1.20.0",
    # Dragonfly (redis-compatible client)
    "redis>=8.1.0",
    "hiredis>=3.4.2",
    # Celery
    "celery>=5.6.3",
    "flower>=2.2.0",
    # Authentication & Security
    "python-jose[cryptography]>=3.5.0",
    "passlib[argon2]>=1.7.4",
    "argon2-cffi>=25.1.0",
    "python-multipart>=0.0.32",
    "bcrypt>=5.0.0",
    "pyotp>=2.10.0",
    "webauthn>=3.0.1",
    "qrcode[pil]>=8.2",
    # Validation
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "email-validator>=2.3.0",
    # HTTP Client (HTTP/3 + DNS-over-HTTPS support)
    "curl_cffi>=0.16.3",
    # JSON Serialization
    "orjson>=3.13.0",
    # HTML Parsing
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    # Subtitles
    "subliminal>=2.7.1",
    "babelfish>=0.6.1",
    # Audio tagging (embed artwork/lyrics into music files)
    "mutagen>=1.48.1",
    # Language Codes
    "python-iso639>=2026.7.23",
    # Torrent Client
    "qbittorrent-api>=2026.10.0",
    # External APIs
    "tmdbv3api>=1.9.0",
    # Utilities
    "python-dotenv>=1.2.4",
    "python-dateutil>=2.9.0.post0",
    "pytz>=2026.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "black>=26.10.0",
    "isort>=9.0.2",
    "flake8>=7.4.1",
    "mypy>=2.4.0",
]

[tool.black]
line-length = 100
target-version = ['py314']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
