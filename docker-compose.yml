services:
  postgres:
    image: postgres:18-alpine
    container_name: kinora-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kinora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kinora_password}
      POSTGRES_DB: ${POSTGRES_DB:-kinora}
    volumes:
      - postgres-data:/var/lib/postgresql
    # Expose PostgreSQL for local development migrations
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kinora}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kinora-network

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: kinora-pgbouncer
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kinora}:${POSTGRES_PASSWORD:-kinora_password}@postgres:5432/${POSTGRES_DB:-kinora}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 20
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      MAX_CLIENT_CONN: 1000
      MAX_DB_CONNECTIONS: 100
      SERVER_IDLE_TIMEOUT: 600
      QUERY_TIMEOUT: 300
      STATS_USERS: ${POSTGRES_USER:-kinora}
      ADMIN_USERS: ${POSTGRES_USER:-kinora}
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h localhost -p 5432 -U ${POSTGRES_USER:-kinora}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kinora-network
    restart: unless-stopped

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.35.1
    container_name: kinora-dragonfly
    command: >
      dragonfly
      --logtostderr
      --dir /data
      --dbfilename dump
      --df_snapshot_format=true
      --snapshot_cron "*/5 * * * *"
      --compression_mode=2
      --proactor_threads=0
      --tcp_nodelay=true
      --hz=100
      --cache_mode=false
    volumes:
      - dragonfly-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kinora-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: kinora-backend
    environment:
      APP_NAME: Kinora
      APP_VERSION: 1.0.0
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-in-production-please}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-jwt-secret-key-in-production-please}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      # PgBouncer connection (for application queries)
      PGBOUNCER_ENABLED: "true"
      PGBOUNCER_HOST: pgbouncer
      PGBOUNCER_PORT: 5432
      # Direct PostgreSQL connection (for migrations)
      POSTGRES_USER: ${POSTGRES_USER:-kinora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kinora_password}
      POSTGRES_DB: ${POSTGRES_DB:-kinora}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql://${POSTGRES_USER:-kinora}:${POSTGRES_PASSWORD:-kinora_password}@postgres:5432/${POSTGRES_DB:-kinora}
      DRAGONFLY_HOST: dragonfly
      DRAGONFLY_PORT: 6379
      DRAGONFLY_DB: 0
      DRAGONFLY_URL: redis://dragonfly:6379/0
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      BACKEND_WORKERS: 4
      BACKEND_RELOAD: false
      CORS_ORIGINS: http://localhost:3000,http://localhost:8000
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      FLARESOLVERR_URL: http://flaresolverr:8191
      CLOUDFLARE_BYPASS_METHOD: flaresolverr
      CELERY_BROKER_URL: redis://dragonfly:6379/0
      CELERY_RESULT_BACKEND: redis://dragonfly:6379/0
      MEDIA_ROOT: /media
      DOWNLOADS_ROOT: /downloads
      TORRENTS_ROOT: /torrents
      INDEXER_REQUEST_TIMEOUT: 30
      INDEXER_MAX_RETRIES: 3
      RSS_SYNC_INTERVAL: 15
      SEARCH_RESULTS_LIMIT: 100
      MIN_SEEDERS: 5
      SUBTITLE_LANGUAGES: en
    volumes:
      - ./backend:/app
      - media-data:/media
      - downloads-data:/downloads
      - torrents-data:/torrents
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
    networks:
      - kinora-network
    restart: unless-stopped

  celery-worker:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: kinora-celery-worker
    command: uv run celery -A app.tasks.celery_app worker --loglevel=info
    environment:
      APP_NAME: Kinora
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-in-production-please}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-jwt-secret-key-in-production-please}
      # PgBouncer connection (for application queries)
      PGBOUNCER_ENABLED: "true"
      PGBOUNCER_HOST: pgbouncer
      PGBOUNCER_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-kinora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kinora_password}
      POSTGRES_DB: ${POSTGRES_DB:-kinora}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql://${POSTGRES_USER:-kinora}:${POSTGRES_PASSWORD:-kinora_password}@postgres:5432/${POSTGRES_DB:-kinora}
      DRAGONFLY_URL: redis://dragonfly:6379/0
      CELERY_BROKER_URL: redis://dragonfly:6379/0
      CELERY_RESULT_BACKEND: redis://dragonfly:6379/0
      MEDIA_ROOT: /media
      DOWNLOADS_ROOT: /downloads
      TORRENTS_ROOT: /torrents
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      FLARESOLVERR_URL: http://flaresolverr:8191
    volumes:
      - ./backend:/app
      - media-data:/media
      - downloads-data:/downloads
      - torrents-data:/torrents
    depends_on:
      pgbouncer:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
    networks:
      - kinora-network
    restart: unless-stopped

  celery-beat:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: kinora-celery-beat
    command: uv run celery -A app.tasks.celery_app beat --loglevel=info
    environment:
      APP_NAME: Kinora
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-in-production-please}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-jwt-secret-key-in-production-please}
      # PgBouncer connection (for application queries)
      PGBOUNCER_ENABLED: "true"
      PGBOUNCER_HOST: pgbouncer
      PGBOUNCER_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-kinora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kinora_password}
      POSTGRES_DB: ${POSTGRES_DB:-kinora}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql://${POSTGRES_USER:-kinora}:${POSTGRES_PASSWORD:-kinora_password}@postgres:5432/${POSTGRES_DB:-kinora}
      DRAGONFLY_URL: redis://dragonfly:6379/0
      CELERY_BROKER_URL: redis://dragonfly:6379/0
      CELERY_RESULT_BACKEND: redis://dragonfly:6379/0
      TMDB_API_KEY: ${TMDB_API_KEY:-}
    volumes:
      - ./backend:/app
    depends_on:
      pgbouncer:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
    networks:
      - kinora-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws}
    container_name: kinora-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - kinora-network
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: kinora-flaresolverr
    environment:
      LOG_LEVEL: info
      LOG_HTML: false
      CAPTCHA_SOLVER: none
    ports:
      - "8191:8191"
    networks:
      - kinora-network
    restart: unless-stopped

networks:
  kinora-network:
    driver: bridge

volumes:
  postgres-data:
  dragonfly-data:
  media-data:
  downloads-data:
  torrents-data:
