services:
  postgres:
    image: postgres:16-alpine
    container_name: nexarr-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexarr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexarr_password}
      POSTGRES_DB: ${POSTGRES_DB:-nexarr}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexarr}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexarr-network

  redis:
    image: redis:7-alpine
    container_name: nexarr-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - nexarr-network

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: nexarr-backend
    environment:
      APP_NAME: Nexarr
      APP_VERSION: 1.0.0
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-in-production-please}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-jwt-secret-key-in-production-please}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      POSTGRES_USER: ${POSTGRES_USER:-nexarr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexarr_password}
      POSTGRES_DB: ${POSTGRES_DB:-nexarr}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nexarr}:${POSTGRES_PASSWORD:-nexarr_password}@postgres:5432/${POSTGRES_DB:-nexarr}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_URL: redis://redis:6379/0
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      BACKEND_WORKERS: 4
      BACKEND_RELOAD: false
      CORS_ORIGINS: http://localhost:3000,http://localhost:8000
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      FLARESOLVERR_URL: http://flaresolverr:8191
      CLOUDFLARE_BYPASS_METHOD: flaresolverr
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      MEDIA_ROOT: /media
      DOWNLOADS_ROOT: /downloads
      TORRENTS_ROOT: /torrents
      INDEXER_REQUEST_TIMEOUT: 30
      INDEXER_MAX_RETRIES: 3
      RSS_SYNC_INTERVAL: 15
      SEARCH_RESULTS_LIMIT: 100
      MIN_SEEDERS: 5
      SUBTITLE_LANGUAGES: en
    volumes:
      - ./backend:/app
      - media-data:/media
      - downloads-data:/downloads
      - torrents-data:/torrents
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nexarr-network
    restart: unless-stopped

  celery-worker:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: nexarr-celery-worker
    command: celery -A app.tasks.celery_app worker --loglevel=info
    environment:
      APP_NAME: Nexarr
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-in-production-please}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-jwt-secret-key-in-production-please}
      POSTGRES_USER: ${POSTGRES_USER:-nexarr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexarr_password}
      POSTGRES_DB: ${POSTGRES_DB:-nexarr}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nexarr}:${POSTGRES_PASSWORD:-nexarr_password}@postgres:5432/${POSTGRES_DB:-nexarr}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      MEDIA_ROOT: /media
      DOWNLOADS_ROOT: /downloads
      TORRENTS_ROOT: /torrents
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      FLARESOLVERR_URL: http://flaresolverr:8191
    volumes:
      - ./backend:/app
      - media-data:/media
      - downloads-data:/downloads
      - torrents-data:/torrents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nexarr-network
    restart: unless-stopped

  celery-beat:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: nexarr-celery-beat
    command: celery -A app.tasks.celery_app beat --loglevel=info
    environment:
      APP_NAME: Nexarr
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-in-production-please}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-jwt-secret-key-in-production-please}
      POSTGRES_USER: ${POSTGRES_USER:-nexarr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexarr_password}
      POSTGRES_DB: ${POSTGRES_DB:-nexarr}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nexarr}:${POSTGRES_PASSWORD:-nexarr_password}@postgres:5432/${POSTGRES_DB:-nexarr}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      TMDB_API_KEY: ${TMDB_API_KEY:-}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nexarr-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws}
    container_name: nexarr-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - nexarr-network
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: nexarr-flaresolverr
    environment:
      LOG_LEVEL: info
      LOG_HTML: false
      CAPTCHA_SOLVER: none
    ports:
      - "8191:8191"
    networks:
      - nexarr-network
    restart: unless-stopped

networks:
  nexarr-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  media-data:
  downloads-data:
  torrents-data:
